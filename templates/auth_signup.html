{% extends "base.html" %}
{% block title %}Sign up · FaithFlow AI{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white shadow-md rounded-lg p-6 mt-6">
  <h1 class="text-2xl font-bold mb-4 text-slate-900 text-center">Create your account</h1>
  <form method="post" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Name</label>
      <input
        type="text"
        name="name"
        required
        class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
      />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
      <input
        type="email"
        name="email"
        required
        class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
      />
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
      <input
        type="password"
        name="password"
        required
        minlength="6"
        class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
      />
    </div>
    <button
      type="submit"
      class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 rounded-md text-sm"
    >
      Sign up
    </button>
  </form>

  <p class="mt-4 text-xs text-slate-600 text-center">
    Already have an account?
    <a href="{{ url_for('login') }}" class="text-emerald-600 hover:underline font-semibold">
      Log in here
    </a>
  </p>
</div>
{% endblock %}
